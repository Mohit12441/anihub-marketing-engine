name: Daily Anime Marketing Engine

on:
  schedule:
    # Runs twice daily: 10:00 UTC & 18:00 UTC
    - cron: '0 10,18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Discovery Strategy'
        required: true
        default: 'trending'
        type: choice
        options:
          - trending
          - schedule
      limit:
        description: 'Number of posts to publish'
        required: true
        default: '1'
      dry_run:
        description: 'Simulate without posting live (Dry Run)'
        required: true
        default: false
        type: boolean

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # Persist SQLite post history database across runs
      - name: Restore Post History Cache
        uses: actions/cache@v4
        with:
          path: post_history.db
          key: post-history-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            post-history-${{ runner.os }}-

      - name: Execute Marketing Automation Engine
        env:
          DRY_RUN: ${{ github.event.inputs.dry_run || 'False' }}
          SITE_BASE_URL: 'https://anihubstream.com'
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          IMGUR_CLIENT_ID: ${{ secrets.IMGUR_CLIENT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          MODE="${{ github.event.inputs.mode || 'trending' }}"
          LIMIT="${{ github.event.inputs.limit || '1' }}"
          python main.py --mode "$MODE" --limit "$LIMIT"

      # Save updated SQLite database to cache
      - name: Save Post History Cache
        uses: actions/cache/save@v4
        if: always()
        with:
          path: post_history.db
          key: post-history-${{ runner.os }}-${{ github.run_id }}
